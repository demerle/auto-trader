# Strategy-research agents (opencode on OpenCode Go). Human-owned: agents cannot edit this.

# The ONE model every agent call uses (researcher, auditor, reviewer, supervisor, and
# opencode's own background calls such as titles). Nothing else is ever used: there are no
# per-role models and no fallbacks. To switch, change this line (`opencode models` lists the options);
# the orchestrator picks it up on its next job, no rebuild needed.
model: opencode-go/glm-5.3-flash

budget:                        # the agents' own spend, USD (about a quarter of the Go plan caps of $12/$30/$60)
  five_hours: 3.0
  week: 7.0
  month: 15.0
  max_jobs_per_day: 4          # jobs started in any 24 hours: opencode's reported cost undercounts Go usage
  quota_retry_hours: {weekly: 6, monthly: 24, default: 1}  # Go said "usage limit exceeded": wait, then probe
  alert_at: 0.8
  seed_estimates: {researcher: 1.5, auditor: 0.4, reviewer: 0.1, supervisor: 0.02,
                   options_researcher: 1.5, options_auditor: 0.4}

timeouts_min: {researcher: 45, auditor: 15, reviewer: 10, supervisor: 5,
               options_researcher: 45, options_auditor: 15}
max_attempts: 2
concurrency: 1
refill_cooldown_hours: 6       # after research for an open slot or seat fails for good, wait before trying again

per_job:
  backtests: 40                # trials an agent may run (every one counts against its DSR)
  submissions: 3

research_intervals: ["1d", "1h", "15m", "5m"]
min_history_sessions: 60       # never research an interval with less archived history
history_years: {"1d": 12, "1h": 2, "15m": 1, "5m": 1, "1m": 1}
max_universe: {"1d": 60, "1h": 25, "15m": 20, "5m": 20, "1m": 10}
holdout_days: {"1d": 365, "1h": 120, "15m": 14, "5m": 14, "1m": 3}   # sealed from agents

review:
  weekday: 5                   # Saturday
  min_window_frac: 0.5         # bots with at least half their evaluation window

daily_commentary: true         # supervisor comments on each daily report (Discord follow-up)
auto_commit: true              # git-commit deployed strategies (when running in a work tree)
sandbox_memory_mb: 3072
