x-app: &app
  build: .
  env_file: .env
  environment:
    AT_DATABASE_URL: postgresql+psycopg://autotrader:${POSTGRES_PASSWORD:-autotrader}@postgres:5432/autotrader
    AT_DATA_DIR: /app/data
  volumes:
    - bars:/app/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autotrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotrader}
      POSTGRES_DB: autotrader
    ports:
      - "127.0.0.1:5433:5432"  # host CLI access only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrader"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && autotrader bots sync"]
    restart: "no"

  api:
    <<: *app
    container_name: autotrader-api
    ports:
      - "8005:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s

  collector:
    <<: *app
    command: ["autotrader", "collect"]

  engine:
    <<: *app
    command: ["autotrader", "engine"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  bars:
