x-app: &app
  build: .
  env_file: .env
  environment:
    AT_DATABASE_URL: postgresql+psycopg://autotrader:${POSTGRES_PASSWORD:-autotrader}@postgres:5432/autotrader
    AT_DATA_DIR: /app/data
  volumes:
    - bars:/app/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autotrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotrader}
      POSTGRES_DB: autotrader
    ports:
      - "127.0.0.1:5433:5432"  # host CLI access only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrader"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && autotrader bots sync"]
    restart: "no"

  api:
    <<: *app
    container_name: autotrader-api
    ports:
      - "127.0.0.1:8006:8000"  # this machine only; use an SSH tunnel or Tailscale from elsewhere
    volumes:
      - bars:/app/data
      - ./autotrader/strategies/generated:/app/autotrader/strategies/generated:ro
      - ./autotrader/options/generated:/app/autotrader/options/generated:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s

  collector:
    <<: *app
    command: ["autotrader", "collect"]
    volumes:
      - bars:/app/data
      - ./autotrader/strategies/generated:/app/autotrader/strategies/generated:ro

  engine:
    <<: *app
    command: ["autotrader", "engine"]
    volumes:
      - bars:/app/data
      - ./autotrader/strategies/generated:/app/autotrader/strategies/generated:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The options gauntlet: its own paper account (ALPACA_OPTIONS_* in .env), its own loop.
  options-engine:
    <<: *app
    command: ["autotrader", "options", "engine"]
    volumes:
      - bars:/app/data
      - ./autotrader/options/generated:/app/autotrader/options/generated:ro
      - ./secrets/schwab:/app/secrets/schwab  # Schwab login token (renewed by `options schwab-login`)
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Strategy-research agents. No broker keys and no .env: only the database URL,
  # the opencode credentials (read-only) and what the orchestrator needs.
  agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    environment:
      AT_DATABASE_URL: postgresql+psycopg://autotrader:${POSTGRES_PASSWORD:-autotrader}@postgres:5432/autotrader
      AT_AGENT_DATABASE_URL: postgresql+psycopg://autotrader_agent:${AGENT_DB_PASSWORD:-}@postgres:5432/autotrader
      AT_DATA_DIR: /app/data
      AT_WORKSPACE_DIR: /app/workspace
      AT_AGENT_USER: agent
      AT_AGENT_HOME: /home/agent
      AT_OPENCODE_AUTH_FILE: /run/secrets/opencode-auth.json
      AT_NTFY_URL: ${AT_NTFY_URL:-}
      AT_DISCORD_WEBHOOK: ${AT_DISCORD_WEBHOOK:-}
      AT_DISCORD_BOT_TOKEN: ${AT_DISCORD_BOT_TOKEN:-}  # orchestrator only; opencode never sees it
      AT_DISCORD_USER_ID: ${AT_DISCORD_USER_ID:-}
    volumes:
      - bars:/app/data
      - ./workspace:/app/workspace
      - ./autotrader/strategies/generated:/app/autotrader/strategies/generated
      - ./autotrader/options/generated:/app/autotrader/options/generated
      - ./secrets/opencode-go.json:/run/secrets/opencode-auth.json:ro
      - ./autotrader/config/agents.yaml:/app/autotrader/config/agents.yaml:ro  # the model setting
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  bars:
