[project]
name = "autotrader"
version = "0.1.0"
description = "LLM-agent strategy arena that paper trades on Alpaca using free market data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "returns>=0.22",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pandas-market-calendars>=4.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
autotrader = "autotrader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autotrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
